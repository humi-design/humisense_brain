# nginx configuration for the frontend image.
#
# The image serves the built SPA and proxies /api to the backend, so the browser sees a
# single origin and the session cookie stays first-party. It is a reference configuration
# for a single-node deployment, not a hardened edge proxy: TLS termination, request-rate
# limiting, and the backend's trusted-proxy count are deployment concerns documented in
# docs/DEPLOYMENT.md.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The backend sets its own on API responses; these cover the static
    # assets. HSTS is only meaningful once TLS is terminated in front of this server, so
    # it is left to the TLS terminator.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # nginx's version is not advertised.
    server_tokens off;

    # Liveness for the container health check. Cheap, no disk access.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The API is proxied to the backend service. `changeOrigin` semantics are not needed;
    # the backend validates Host through its own configuration.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend trusts one proxy hop by default; see TRUSTED_PROXY_COUNT.
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Static assets are content-hashed by Vite, so they are safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA fallback. Unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
