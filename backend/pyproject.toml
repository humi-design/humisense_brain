[project]
name = "humisense-brain"
version = "0.1.0"
description = "Humisense Brain / OS - Layer 1: Secure Connector & Sensory Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.32",
    "alembic>=1.14,<2",
    "greenlet>=3.1,<4",
    "httpx>=0.27,<0.30",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=43,<51",
    "redis>=5.2,<7",
    "arq>=0.26,<0.27",
    "structlog>=24.4,<26",
    "prometheus-client>=0.21,<0.24",
    "python-multipart>=0.0.18,<0.1",
    "orjson>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<0.15",
    "mypy>=1.13,<2",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humisense"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic revision files are generated by `alembic revision --autogenerate` and are
# re-generated, not hand-edited. `alembic/env.py` is written by hand and stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF", "ASYNC", "T20", "BLE",
]
ignore = [
    # Tests intentionally use assert.
    "S101",
    # Exception class names are part of the public error taxonomy; renaming them to
    # satisfy a linter would be a worse interface.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# ASYNC251: a fixed-window expiry test has to let real time pass; there is no other way
# to observe the window rolling over.
# ASYNC109: test backends implement httpcore's AsyncNetworkBackend interface, whose
# `timeout` parameter is part of the contract.
# S104/S108: the network tests bind a throwaway server to all interfaces and pass a
# throwaway path to the unix-socket refusal path.
"tests/*" = ["S105", "S106", "S311", "S101", "ASYNC251", "ASYNC109", "S104", "S108"]
# T201: these are operator-facing command-line tools. Their output is the interface, so
# print is correct here; the service itself logs through structlog.
"src/humisense/devtools/*" = ["S105", "S106", "T201"]
# Enum members and default constants that name an authentication mode, not a value.
"src/humisense/connectors/types.py" = ["S105"]
"src/humisense/config.py" = ["S105"]
# Retry jitter is not a security decision; secrets use the secrets module.
"src/humisense/services/ingestion.py" = ["S311"]
# ASYNC109: the pinned transport implements httpcore's AsyncNetworkBackend interface, so
# the `timeout` parameter is part of the contract and cannot be replaced by asyncio.timeout.
"src/humisense/security/pinned_transport.py" = ["ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["humisense"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["humisense"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one loop: the container holds a connection pool whose
# connections are bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:humisense.*"]

[[tool.mypy.overrides]]
# Tracing is optional. When the OpenTelemetry SDK is absent the import must still
# type-check so the module degrades to a no-op instead of failing the build.
module = "opentelemetry.*"
ignore_missing_imports = true

[tool.bandit]
# Reviewed exceptions. Each is a false positive, not a suppressed real finding.
# B105 (config.py:19)  - DEFAULT_DEV_SESSION_SECRET is a sentinel. Production config
#                        validation refuses to start while it is still in use.
# B105 (types.py)      - AuthMode / ConfigFieldType enum *members* named BEARER_TOKEN and
#                        SECRET_STRING. These are type labels, not credentials.
# B311 (ingestion.py)  - retry jitter only. All security-sensitive randomness uses the
#                        `secrets` module.
skips = ["B105", "B311"]
